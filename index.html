<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Masked House</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="viewport">
    <!-- The whole game lives on a fixed 1600x900 (16:9) canvas that is scaled to fit the window.
         Everything is placed at exact pixel positions on that canvas (see css/style.css). -->
    <main id="stage">

      <!-- LEFT: the masked figure, counters, inventory -->
      <div id="figure"></div>
      <div id="walk-frames" class="anim-frames"></div>
      <div id="hurt-frames" class="anim-frames"></div>
      <div id="heal-frames" class="anim-frames"></div>
      <div id="flash"></div>
      <div id="floaters"></div>

      <div id="hud">
        <div id="stat-health">
          <img id="hp-icon" src="assets/ui/hp-counter.png" alt="Health" draggable="false">
          <div class="nums" id="hp-nums"><span class="big" id="hp-now">10</span><span class="dash">/</span><span class="small" id="hp-max">10</span></div>
          <div class="hud-tip" role="tooltip">Lose all, and you lose yourself.</div>
        </div>
        <div id="stat-turns">
          <img id="eye-icon" src="assets/ui/eye-counter.png" alt="Turns" draggable="false">
          <div class="nums" id="eye-nums"><span class="big" id="turn-now">0</span><span class="dash">/</span><span class="small" id="turn-max">20</span></div>
          <div class="hud-tip" role="tooltip" id="eye-tip">Reach 20, and you're discovered.</div>
        </div>
        <div id="stat-ready">
          <img id="ready-icon" src="assets/ui/readiness-counter.png" alt="Combat readiness" draggable="false">
          <div class="nums" id="ready-nums"><span class="big" id="ready-now">0</span><span class="dash">/</span><span class="small" id="ready-max">20</span></div>
          <div class="hud-tip" role="tooltip">Combat readiness: the higher, the likelier you strike first.</div>
        </div>
      </div>

      <div id="inventory" aria-label="Inventory"></div>
      <div id="item-pop" hidden></div>

      <!-- CENTRE: the map, inside the carved frame -->
      <div id="board-wrap">
        <div id="board">
          <div id="cells"></div>
          <div id="doors"></div>
          <div id="marker"></div>
          <!-- your spark, running round the border of the room you are in -->
          <div id="spark" hidden><div class="spark-sprite"></div></div>
          <!-- the fate die rolls here, over the room being explored, then fades away (js/die3d.js) -->
          <div id="map-die" class="die3d" aria-label="Fate die" hidden></div>
        </div>
      </div>
      <!-- the road: the travel map between houses (js/route.js, js/road-ui.js) -->
      <div id="route-bg" aria-hidden="true"></div>
      <div id="route-wrap" hidden>
        <svg id="route-lines" width="500" height="836" aria-hidden="true"></svg>
        <div id="route-nodes"></div>
      </div>
      <!-- a fight (js/combat.js, js/fight-ui.js): your three slots on the left, the enemy's on the right, your hand below -->
      <div id="fight-wrap" hidden>
        <div id="fight-prompt"></div>
        <div id="fight-rows"></div>
        <div id="fight-hand"></div>
        <div id="fight-deck" title="Your deck"><span id="fight-deck-n"></span></div>
      </div>
      <!-- the great doors over the centre: shut at the start (Embark), they slide apart top and bottom -->
      <div id="gate" class="shut">
        <img class="gate-door top" src="assets/ui/gate-door.png" alt="" draggable="false">
        <img class="gate-door bottom" src="assets/ui/gate-door.png" alt="" draggable="false">
        <div id="gate-dust"><div class="dust-layer top"></div><div class="dust-layer bottom"></div></div>
        <button id="embark" type="button">Embark</button>
        <div id="gate-word" aria-live="assertive"></div>
      </div>
      <img id="frame" src="assets/ui/center-pillars.png" alt="" draggable="false">

      <!-- RIGHT: the fate die, the current room, the chronicle -->
      <section id="right">
        <div id="die-row">
          <div id="die-info">
            <div id="die-text">Step through a door to cast it.</div>
          </div>
        </div>
        <div id="room-card"></div>
        <div id="notice" role="status"></div>
        <div id="right-foot">
          <button id="chronicle-toggle" type="button" class="quiet" title="The rooms you have explored (C)">Chronicle</button>
          <span id="seed"></span>
          <button id="new-game" type="button">New game</button>
        </div>
        <!-- tucked away until the Chronicle button (or the C key) is pressed -->
        <div id="chronicle-wrap" hidden>
          <div class="chronicle-head">
            <div class="section-label">Chronicle</div>
            <button id="chronicle-close" type="button" class="quiet" aria-label="Close the chronicle">Close</button>
          </div>
          <ol id="chronicle"></ol>
        </div>
      </section>

      <!-- RIGHT, during a fight: the enemy, mirroring the player -->
      <div id="enemy" hidden>
        <img id="enemy-img" src="assets/ui/enemy-duellist.png" alt="" draggable="false">
        <div id="enemy-floaters"></div>
        <div id="enemy-hud">
          <img id="enemy-hp-icon" src="assets/ui/hp-counter.png" alt="Enemy health" draggable="false">
          <div class="nums" id="enemy-hp-nums"><span class="big" id="enemy-hp-now">4</span><span class="dash">/</span><span class="small" id="enemy-hp-max">4</span></div>
          <div id="enemy-name"></div>
        </div>
      </div>

      <!-- warnings: the screen edges glow when discovery is near (blue) or health is low (red) -->
      <div id="danger-eye" class="danger"></div>
      <div id="danger-hp" class="danger"></div>

      <!-- pause screen (Esc) -->
      <div id="pause" hidden>
        <div class="overlay-card">
          <h2>Paused</h2>
          <p>The house holds its breath. Nothing stirs until you return.</p>
          <div class="sound-settings">
            <label>Music <input id="vol-music" type="range" min="0" max="100" step="1"></label>
            <label>Effects <input id="vol-sfx" type="range" min="0" max="100" step="1"></label>
            <button id="sound-mute" type="button" class="quiet" title="Press M to mute or unmute at any time">Sound: on</button>
          </div>
          <div class="voice-settings">
            <div class="voice-row">
              <button id="voice-toggle" type="button" class="quiet" title="Press V to turn the voice on or off at any time">Voice: on</button>
              <select id="voice-select" aria-label="Voice"></select>
              <button id="voice-test" type="button" class="quiet">Hear it</button>
            </div>
            <div class="voice-row">
              <label>Volume <input id="voice-volume" type="range" min="0" max="100" step="1"></label>
              <label>Pace <input id="voice-rate" type="range" min="50" max="120" step="1"></label>
              <label>Pitch <input id="voice-pitch" type="range" min="30" max="120" step="1"></label>
            </div>
          </div>
          <div class="overlay-buttons">
            <button id="pause-resume" type="button">Return to game</button>
            <button id="pause-new" type="button" class="quiet">New game</button>
          </div>
        </div>
      </div>

      <!-- end of the run: won, discovered, fallen, or nowhere left to go -->
      <div id="overlay" hidden>
        <div class="overlay-card">
          <h2 id="overlay-title"></h2>
          <p id="overlay-text"></p>
          <div class="overlay-buttons">
            <button id="overlay-new" type="button">Begin anew</button>
            <button id="overlay-look" type="button" class="quiet">Look at the map</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/rng.js"></script>
  <script src="js/data.js"></script>
  <script src="js/dungeon.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/game.js"></script>
  <script src="js/route.js"></script>
  <script src="js/art.js"></script>
  <script src="js/die3d.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/road-ui.js"></script>
  <script src="js/fight-ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
